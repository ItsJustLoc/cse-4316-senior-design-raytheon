name: Repository checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Test commit-message validation
        run: python -m unittest discover -s tests -v
      - name: Check files and staged secrets
        run: pre-commit run --all-files
      - name: Scan full Git history for secrets
        run: pre-commit run gitleaks-history --hook-stage manual --all-files
      - name: Check PR commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python scripts/check_commit_message.py --range "$BASE_SHA..$HEAD_SHA"
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          python scripts/check_commit_message.py "$RUNNER_TEMP/pr-title.txt"
      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python scripts/check_commit_message.py --range "$GITHUB_SHA"
          else
            python scripts/check_commit_message.py --range "$BEFORE_SHA..$GITHUB_SHA"
          fi
